zones:
  academic:
    buildings:
      - name: "Engineering Block"
        floors: 3
        classrooms_per_floor: 6
        labs_per_floor: 2
      - name: "Science Block"
        floors: 3
        classrooms_per_floor: 5
        labs_per_floor: 1
      - name: "Lecture Hall Complex"
        floors: 1
        halls: 2
  residential:
    buildings:
      - name: "Boys Hostel"
        floors: 5
        rooms_per_floor: 40
        students_per_room: 2
      - name: "Girls Hostel"
        floors: 5
        rooms_per_floor: 40
        students_per_room: 2
      - name: "PG Hostel"
        floors: 3
        rooms_per_floor: 30
        students_per_room: 1
  library:
    buildings:
      - name: "Main Library"
        floors: 2
        pc_terminals: 80
        printers: 4
      - name: "Research Lab Block"
        floors: 1
        labs: 3
  administrative:
    buildings:
      - name: "Admin Block"
        floors: 2
      - name: "Faculty Building"
        floors: 3
  infrastructure:
    buildings:
      - name: "Data Center"
        rooms: 1
      - name: "NOC"
        rooms: 1

network:
  layer_0_core:
    pair:
      active: "CORE-SW-01"
      standby: "CORE-SW-02"
    lag:
      members: 4
      speed_gbps: 40
  layer_1_distribution:
    switches:
      - name: "DIST-SW-ACAD"
        zone: "academic"
        type: "vsf_stack"
        members: 2
        uplink_gbps: 10
      - name: "DIST-SW-RESID"
        zone: "residential"
        type: "vsf_stack"
        members: 2
        uplink_gbps: 10
      - name: "DIST-SW-LIB"
        zone: "library"
        type: "standalone"
        uplink_gbps: 10
      - name: "DIST-SW-ADMIN"
        zone: "administrative"
        type: "standalone"
        uplink_gbps: 10
  layer_2_access:
    ports_per_switch: 48
    lag_to_dist_members: 2
    lag_speed_gbps: 1
